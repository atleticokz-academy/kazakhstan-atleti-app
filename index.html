<style>
/* Club world: navy + Atlético red on a warm paper. App shell: top bar, tabs, year switcher, cards. */

*{box-sizing:border-box}

.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}

.tabs a.on{background:#fff;color:var(--navy)}

.tabs a.on:hover{background:#fff}
.years{background:var(--paper);border-bottom:1px solid var(--line)}

.kzt{font:700 7.2px Inter,Arial;fill:#282a6f;pointer-events:none}.kzv{font:800 10px "Inter Tight",Inter,Arial;fill:#282a6f;pointer-events:none}.kzt,.kzv{paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2px;stroke-linejoin:round}.kzt.w,.kzv.w{fill:#fff;stroke:rgba(20,20,60,.55)}

.ctool{flex-wrap:wrap;gap:8px}.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font:700 13px var(--fb,Inter);color:var(--navy);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}.seg button small{font-size:10px;font-weight:600;opacity:.7}.seg button.on{background:var(--navy);color:#fff}.seg button[disabled]{opacity:.4}.seg.sm button{padding:8px 12px}

    out.push({id:"cal_"+m.id,ext:1,tipo,fecha:m.date,fin:m.end&&m.end!==m.date?m.end:"",hora:m.time||"",gen:g,filial:!!m.filial,rival:m.rival||"",campo:m.home?"local":"visitante",lugar:[m.ground,m.place,m.region,m.city].filter(Boolean)[0]||"",comp:C[m.comp]||m.note||"",gf:m.gf??"",gc:m.ga??"",link:m.link||"",titulo:m.name||"",tbd:!!m.tbd})}

function pMin(e,pid){const c=(e.conv||{})[pid];if(!c)return 0;const dur=+e.dur||0;if(!c.tit&&(c.ent===""||c.ent==null))return 0;const a=c.tit?0:(+c.ent||0),b=(c.sal===""||c.sal==null)?dur:(+c.sal||0);return Math.max(0,b-a)}

function radarMulti(series,labels,size=320){
  const base=hexSVG(Array(labels.length).fill(0),null,labels,size), n=labels.length, cx=size/2+0.5, cy=size/2+4, R=size*0.31;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+R*v/9*Math.cos(a),cy+R*v/9*Math.sin(a)]};
  let s="";for(const {vals,color,dash} of series){if(!vals.some(v=>v>0))continue;
    s+=`<polygon points="${vals.map((v,i)=>pt(i,v||0).map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="${dash?"none":color}" fill-opacity="${series.length>1?0.08:0.18}" stroke="${color}" stroke-width="${dash?2:2.5}" ${dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round"/>`;
    if(!dash)vals.forEach((v,i)=>{if(v>0){const[x,y]=pt(i,v);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size*0.012}" fill="${color}"/>`}})}
  return base.replace("</svg>",s+"</svg>");
}

async function makePdf(list,filename){
  if(!list.length){toast("Elige un jugador");return}
  const note=$("#dlnote");if(note)note.textContent="Preparando el PDF…";toast("Preparando el PDF…");
  try{await loadJsPDF()}catch(_){toast("No se pudo cargar el generador de PDF");return}
  const logo=await imgData("logo.png","image/png");
  try{await loadFonts()}catch(_){fontB64=null}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});useFonts(doc);
  for(let i=0;i<list.length;i++){if(i)doc.addPage();await pdfPlayer(doc,list[i],logo,doc.getNumberOfPages())}

var staffList=null,staffSub=false,newAr=new Set();
var U_AR=["direccion","scouting","tecnico","medico","marketing"],U_N={direccion:"Dirección (todo)",scouting:"Scouting",tecnico:"Área de entrenamiento",medico:"Área médica",marketing:"Marketing"};
function staffWatch(){if(staffSub||!isAdmin())return;staffSub=true;firebase.firestore().collection("staff").onSnapshot(sn=>{staffList=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nombre||a.id).localeCompare(String(b.nombre||b.id)));const ae=document.activeElement;if(route==="inicio"&&!(ae&&ae.closest&&ae.closest(".ucard")))render()},()=>{staffList=[]})}
var arOf=x=>String(x.area||x.areas||"").split(/[,\s]+/).filter(Boolean);
function usersCard(){if(typeof U_AR==="undefined"||!U_AR||!uiUser)return "";staffWatch();const me=((firebase.auth().currentUser||{}).email||"").toLowerCase();
  const chips=(id,cur)=>`<div class="uar">${U_AR.map(a=>`<label class="${cur.includes(a)?"on":""}"><input type="checkbox" hidden data-uar="${esc(id)}|${a}"${cur.includes(a)?" checked":""}>${tr(U_N[a])}</label>`).join("")}</div>`;
  return `<div class="card ucard" style="margin-top:16px"><h2>👥 ${tr("Usuarios y accesos")}</h2><p class="hint">${tr("Da de alta a cada persona con su correo y elige sus áreas. Dirección ve y edita todo. Para quitar el acceso a alguien, bórralo de la lista.")}</p>
   ${staffList===null?`<p class="hint">…</p>`:`<div class="tablewrap"><table class="utab">${staffList.map(x=>`<tr><td><b data-noi18n>${esc(x.nombre||"")}</b><span class="umail" data-noi18n>${esc(x.id)}</span></td><td>${chips(x.id,arOf(x))}</td><td>${x.id===me?"":`<button class="btn ghost sm" data-udel="${esc(x.id)}" style="color:var(--red);border-color:var(--red)">${tr("Quitar acceso")}</button>`}</td></tr>`).join("")}</table></div>`}
   <h3 style="margin:14px 0 0">${tr("Nueva persona")}</h3><div class="uform"><input type="text" id="unom" placeholder="${tr("Nombre")}"><input type="email" id="umail" placeholder="${tr("Correo")}"><input type="text" id="upw" placeholder="${tr("Contraseña (vacía si ya tiene cuenta)")}"></div>
   <div style="margin-top:8px">${chips("_new",[...newAr])}</div><div class="toolbar" style="margin-top:10px"><button class="btn red" data-uadd>${tr("Dar de alta")}</button><span class="hint" id="umsg"></span></div></div>`}
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!t.dataset.uar)return;e.stopImmediatePropagation();if(!isAdmin())return;const [id,a]=t.dataset.uar.split("|");t.parentElement.classList.toggle("on",t.checked);
  if(id==="_new"){t.checked?newAr.add(a):newAr.delete(a);return}
  const x=(staffList||[]).find(s=>s.id===id);if(!x)return;const L=new Set(arOf(x));t.checked?L.add(a):L.delete(a);if(!L.size){t.checked=true;t.parentElement.classList.add("on");return}
  try{await firebase.firestore().doc("staff/"+id).set({area:[...L].join(",")},{merge:true});setStatus("ok",tr("Guardado"))}catch(_){setStatus("warn",tr("No se pudo guardar"))}},true);
document.addEventListener("click",async e=>{const t=e.target;if(!t.closest)return;let b;
  if((b=t.closest("[data-udel]"))){e.stopImmediatePropagation();if(!isAdmin())return;const id=b.dataset.udel;ask(tr("¿Quitar el acceso a")+" "+id+"?",tr("Quitar acceso"),async()=>{try{await firebase.firestore().doc("staff/"+id).delete()}catch(_){setStatus("warn",tr("No se pudo guardar"))}});return}
  if(t.closest("[data-uadd]")){e.stopImmediatePropagation();if(!isAdmin())return;const nm=$("#unom").value.trim(),em=$("#umail").value.trim().toLowerCase(),pw=$("#upw").value,msg=$("#umsg");

      await firebase.firestore().doc("staff/"+em).set({nombre:nm,area:[...newAr].join(",")});newAr=new Set();if(document.activeElement)document.activeElement.blur();render();const m2=$("#umsg");if(m2)m2.textContent=tr("Hecho. Ya puede entrar con su correo y su contraseña.")}
    catch(err){console.error(err);msg.textContent=tr("No se pudo guardar")}}},true);
function startData(){if(db)return;(async()=>{
  db=firebase.firestore();
  if(!db){setStatus("warn","Sin conexión a datos: los cambios no se guardarán");return}
  const timer=setTimeout(()=>setStatus("warn","Los datos tardan en llegar…"),10000);
  const subs={};function ensureSubs(){
  if(!subs.p&&(canMod("scouting")||ownsMod("equipo"))){subs.p=1;db.collection("players").onSnapshot(snap=>{
    clearTimeout(timer);dbOK=true;
    for(const ch of snap.docChanges()){const id=ch.doc.id;if(ch.type==="removed"){delete players[id];delete lastSaved[id];continue}
      const d0=ch.doc.data();lastSaved[id]=JSON.parse(JSON.stringify({...d0,id}));if(pending[id]||writing[id]) continue; players[id]={...JSON.parse(JSON.stringify(d0)),id}}
    if(!snap.metadata.fromCache) setStatus("ok","Datos guardados en la nube");
    if(!document.activeElement||!document.activeElement.closest||!document.activeElement.closest("#drawer,.form,textarea")) render();
  },err=>{clearTimeout(timer);setStatus("warn","No se pueden leer los datos ("+err.code+")")});}
  if(!subs.e&&canMod("equipo")){subs.e=1;try{db.collection("events").onSnapshot(sn=>{for(const ch of sn.docChanges()){const id=ch.doc.id;if(ch.type==="removed"){delete evs[id];continue}if(evTimers[id]&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest("[data-ev],[data-st]"))continue;const d=ch.doc.data();if(d&&d.tipo&&d.fecha)evs[id]={...d,id}}
    const ae=document.activeElement;if(route==="equipo"&&!(ae&&ae.closest&&ae.closest("input,textarea,select")))render();else if(openId&&ptab==="partidos")render()},()=>{})}catch(_){}}
  if(!subs.c&&canMod("equipo")){subs.c=1;try{db.doc("coord/plantilla").onSnapshot(sn=>{if(coordTimer)return;const d=sn.exists?sn.data():null;if(d){coord={...JSON.parse(JSON.stringify(DEF_COORD)),...d,slots:{...(d.slots||{})}};if(!coord.campos||!coord.campos.length)coord.campos=["Campo 1"]}const ae=document.activeElement;if(route==="equipo"&&!(ae&&ae.closest&&ae.closest("input,textarea,select")))render()},()=>{})}catch(_){}}
  if(!subs.t&&canMod("equipo")){subs.t=1;try{db.collection("tasks").onSnapshot(sn=>{for(const ch of sn.docChanges()){const id=ch.doc.id;if(ch.type==="removed"){delete tasks[id];continue}if(taskTimers[id])continue;tasks[id]={...ch.doc.data(),id}}const ae=document.activeElement;if(route==="equipo"&&!pzDrag&&!(ae&&ae.closest&&ae.closest("input,textarea,select")))render()},()=>{})}catch(_){}}
  if(!subs.l&&canMod("scouting")){subs.l=1;try{let q=db.collection("log");if(typeof q.orderBy==="function")q=q.orderBy("t","desc").limit(300);q.onSnapshot(sn=>{const m=new Map(actLog.map(e=>[e._id,e]));for(const ch of sn.docChanges()){if(ch.type==="removed")m.delete(ch.doc.id);else{const d=ch.doc.data();if(d&&d.t&&d.accion)m.set(ch.doc.id,{...d,_id:ch.doc.id})}}actLog=[...m.values()].sort((a,b)=>a.t<b.t?1:-1).slice(0,300);if(route==="inicio"&&!openId)render()},()=>{})}catch(_){}}
  if(!subs.p){clearTimeout(timer);dbOK=true;setStatus("ok","Datos guardados en la nube")}}
  ensureSubs();
  db.doc("settings/main").onSnapshot(s=>{if(s.exists&&!sTimer&&!sWriting){const d=s.data();settings={formato:{...DEF_FMT,...(d.formato||{})},formacion:{...(d.formacion||{})},formacion2:{...(d.formacion2||{})},cortes:{...(d.cortes||{})},preguntas:[...(d.preguntas||[])],decision:{...(d.decision||{})},needs:{...(d.needs||{})},permisos:{...(d.permisos||{})}};ensureSubs();if(!document.activeElement||!document.activeElement.closest||!document.activeElement.closest("textarea,input,select"))render()}},()=>{});
})()}
